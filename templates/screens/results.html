<section id="results-page" hidden aria-labelledby="results-title">
  <div class="row results-header">
    <div class="results-heading-copy"><span class="eyebrow">REFLECT · REFINE · REPEAT</span>
    <h1 id="results-title" tabindex="-1">Your session review</h1>
    <p>See what worked, find your next step, and keep building.</p></div>
    <button id="back-to-interview">Back to interview setup</button>
  </div>
  <p id="session-storage-status" role="status"></p>
  <button id="retry-session-save" hidden>Retry saving session</button>
  <p id="results-empty">
    Choose a completed session from Saved interview sessions to view its feedback.
  </p>
  <div class="actions results-toolbar" role="group" aria-label="Download or print session report">
    <button id="download-readable-report" disabled>Download report (HTML)</button>
    <button id="export-report" disabled>Download report (JSON)</button
    ><button id="print-report" disabled>Print / save as PDF</button>
  </div>
  <div class="card" id="session-report" hidden></div>
</section>
