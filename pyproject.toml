[project]
name = "hypersense-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dakshver12", email = "168059924+Dakshver12@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "python-multipart",
    "pydantic>=2",
    "google-genai",
    "groq",
    "faster-whisper",
    "opencv-python-headless>=4.10,<5",
    "mediapipe",
    "numpy",
    "httpx",
    "psycopg[binary]>=3.2,<4",
    "psycopg_pool>=3.2,<4",
    "pypdf>=6,<7",
    "python-docx>=1.1,<2",
    "av>=11,<17",
]

[project.scripts]
hypersense-ai = "hypersense_ai:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.vercel]
entrypoint = "main:app"
